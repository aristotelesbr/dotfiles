onboarding = false

[theme]
# Matches nvim (tokyonight-night) and the Tokyo Compact terminal profile
name = "tokyo-night"

# Keybindings mirroring tmux (see ~/.config/tmux/tmux.reset.conf)
[keys]
prefix = "ctrl+a"

# Vi-style pane navigation
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Splits: | side by side, - stacked
split_vertical   = "prefix+shift+backslash"
split_horizontal = "prefix+minus"

close_pane = "prefix+x"
new_tab    = "prefix+c"

# Worktrees: prefix+shift+g creates one; these close the loop
open_worktree      = "prefix+alt+g"
remove_worktree    = "prefix+ctrl+g"

# Workspace switching without going through the picker
switch_workspace   = "prefix+shift+1..9"
previous_workspace = "prefix+shift+left"
next_workspace     = "prefix+shift+right"
last_pane          = "prefix+tab"

# Workspace picker (C-a w): vi-style navigation, not just arrow keys
navigate_workspace_up   = ["k", "up"]
navigate_workspace_down = ["j", "down"]
